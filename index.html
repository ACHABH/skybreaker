<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SKYBREAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direction: night-sky arcade. Slanted chunky controls, ember + aether accents on deep ink glass. Single committed dark look. */
:root{
  --ink:#0a1128; --ink2:#131d44; --panel:rgba(9,15,38,.74); --line:rgba(255,255,255,.14);
  --fg:#f3f6ff; --mute:#9fb0d6; --ember:#ff6a3d; --aether:#5be7ff; --gold:#ffd45a; --good:#8dffa0; --warn:#ff9a5a; --bad:#ff5d7a;
  --fd:'Bungee','Impact','Arial Black',system-ui,sans-serif; --fu:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--fu);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-size:15px}
#ui *{box-sizing:border-box}
.hide{display:none!important}
button{font-family:var(--fu);cursor:pointer}
/* ---------- menu screens ---------- */
#scr{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-start;padding:4vh max(16px,5vw);overflow:auto;
  background:linear-gradient(95deg,rgba(6,10,28,.88) 0%,rgba(6,10,28,.62) 42%,rgba(6,10,28,.12) 100%)}
.logo{font-family:var(--fd);font-size:clamp(46px,9vw,118px);line-height:.9;margin:0;letter-spacing:.02em;background:linear-gradient(180deg,#fff2b8 0%,var(--gold) 36%,var(--ember) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(120,30,10,.55)) drop-shadow(0 0 24px rgba(255,106,61,.35));transform:skewX(-6deg);transform-origin:left}
.tag{font-size:clamp(14px,1.6vw,19px);color:var(--mute);margin:14px 0 26px;max-width:34em;line-height:1.45}
.tag b{color:var(--fg);font-weight:600}
.menu{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.btn{position:relative;border:0;color:var(--fg);background:linear-gradient(180deg,#27346b,#18224d);padding:13px 22px;font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;transform:skewX(-8deg);border-left:5px solid var(--aether);box-shadow:0 4px 0 #0a1030,0 10px 24px rgba(0,0,0,.35);transition:transform .12s,background .12s,border-color .12s}
.btn>span{display:block;transform:skewX(8deg)}
.btn small{display:block;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--mute);text-transform:none;margin-top:2px}
.btn:hover,.btn:focus-visible{background:linear-gradient(180deg,#3b4d96,#25326e);transform:skewX(-8deg) translateX(8px);outline:none;border-left-color:var(--gold)}
.btn.go{background:linear-gradient(180deg,#ff8a4a,#e2461f);border-left-color:var(--gold);box-shadow:0 4px 0 #7a240c,0 10px 24px rgba(255,106,61,.3)}
.btn.go small{color:#ffe3d0}
.btn.go:hover{background:linear-gradient(180deg,#ffa066,#f2552b)}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.off{opacity:.45;pointer-events:none}
.back{margin-top:22px;width:max-content}
h2.sec{font-family:var(--fd);font-weight:400;font-size:clamp(26px,4vw,44px);margin:0 0 6px;letter-spacing:.03em}
.sub{color:var(--mute);margin:0 0 18px;max-width:46em;line-height:1.45}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:1080px}
.card{pointer-events:auto;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:14px 16px 14px;border-radius:4px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s,background .12s;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,var(--aether))}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c,var(--aether));background:rgba(20,30,70,.82);outline:none}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 28px rgba(255,212,90,.25)}
.card.lock{opacity:.5}
.card .ic{font-size:30px;line-height:1}
.card h3{margin:8px 0 0;font-size:19px;letter-spacing:.04em}
.card .sb{font-size:12px;color:var(--c,var(--aether));letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.card p{margin:8px 0 6px;font-size:13px;color:var(--mute);line-height:1.4}
.card .tg{font-size:11px;color:#c9d6f5;opacity:.8}
.card .st{font-size:18px;letter-spacing:2px;color:var(--gold);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.chips .lb{font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-right:4px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);padding:7px 14px;font-weight:600;font-size:13px;letter-spacing:.06em;border-radius:2px}
.chip.on{background:var(--aether);color:#04202a;border-color:var(--aether)}
.mlist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.mis{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:11px 14px;border-radius:4px;border-left:5px solid var(--c,var(--aether))}
.mis:hover{background:rgba(25,36,82,.85)}
.mis .ch{font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.mis h4{margin:0;font-size:17px}.mis p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.mis .st{color:var(--gold);letter-spacing:2px;font-size:17px;white-space:nowrap}
.mis.boss{border-left-color:var(--bad)}
.mis.lock{opacity:.4;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;max-width:640px;font-size:14px}
.kv b{color:var(--aether);letter-spacing:.06em;white-space:nowrap}
.set{display:grid;grid-template-columns:140px 1fr;gap:12px 18px;align-items:center;max-width:520px}
.set input[type=range]{width:100%;accent-color:var(--ember)}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:54px;height:54px;border-radius:4px;border:2px solid var(--line);position:relative;color:transparent;font-size:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.sw.lock{opacity:.35}
.sw.lock::after{content:attr(data-need);position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700}
.note{font-size:12px;color:var(--mute);margin-top:18px}
.warnbox{margin-top:18px;font-size:12.5px;color:#ffd9a8;max-width:34em}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(4px)}
#race{position:absolute;left:16px;top:16px;width:236px;padding:10px 12px 8px}
#race .hd{font-size:11px;letter-spacing:.16em;color:var(--mute);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.rr{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0;font-weight:600}
.rr .bar{height:7px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.rr .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cc,#fff)}
.rr .pc{text-align:right;font-variant-numeric:tabular-nums}
.rr.me{color:var(--gold)}
#mine{display:flex;align-items:baseline;gap:10px}
#mine .big{font-family:var(--fd);font-size:40px;line-height:1;color:var(--fg)}
#mine .lb{font-size:11px;letter-spacing:.14em;color:var(--mute)}
.ibar{height:10px;background:rgba(255,255,255,.12);margin-top:6px;position:relative}
.ibar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ember),var(--gold))}
.ibar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--aether)}
#gh{font-size:12px;margin-top:6px;color:var(--aether);font-weight:600}
#sb{font-size:13px;margin-top:6px;color:var(--gold);font-weight:700;letter-spacing:.05em}
#timer{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;padding:6px 22px 8px}
#timer .t{font-family:var(--fd);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#timer .t.low{color:var(--bad)}
#timer .p{font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:600;min-height:14px}
#timer .p.hot{color:var(--ember)}
#chain{position:absolute;right:22px;top:26%;text-align:right;opacity:0;transition:opacity .25s}
#chain.on{opacity:1}
#chain .n{font-family:var(--fd);font-size:46px;color:var(--gold);text-shadow:0 4px 0 #7a240c,0 0 22px rgba(255,170,60,.5);transform-origin:right}
#chain .n.pop{animation:pop .28s}
#chain .l{font-family:var(--fd);font-size:20px;color:var(--ember);text-shadow:0 2px 0 #3a0e00;letter-spacing:.06em}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid rgba(255,255,255,.75);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%}
#cross.hit{border-color:var(--gold);transform:scale(1.15)}
#hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;max-width:96vw;flex-wrap:wrap;justify-content:center}
.slot{width:62px;height:62px;position:relative;background:var(--panel);border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;overflow:hidden}
.slot.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(255,212,90,.45);transform:translateY(-6px)}
.slot .k{position:absolute;left:4px;top:2px;font-size:10px;color:var(--mute);font-weight:700}
.slot .i{font-size:26px;line-height:1}
.slot .u{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700;color:var(--aether)}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);height:0}
.slot .nm{position:absolute;left:0;right:0;bottom:2px;font-size:8.5px;text-align:center;color:#cfd8f5;letter-spacing:.04em;display:none}
.slot.sel .nm{display:block}
.slot.sel .u{bottom:12px}
#toasts{position:absolute;left:50%;top:124px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(520px,92vw)}
.toast{padding:7px 16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--aether);font-weight:700;letter-spacing:.05em;font-size:13.5px;animation:tin .2s;border-radius:2px}
.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}.toast.secret{border-left-color:var(--gold);color:var(--gold)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0;transform:scale(.94);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:none}
#banner h1{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(34px,6vw,72px);letter-spacing:.04em;color:#fff;text-shadow:0 5px 0 #7a240c,0 0 34px rgba(255,106,61,.55)}
#banner p{margin:6px 0 0;font-size:18px;color:var(--gold);font-weight:600;letter-spacing:.08em}
#count{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--fd);font-size:clamp(70px,13vw,160px);color:#fff;text-shadow:0 8px 0 #7a240c,0 0 40px rgba(255,106,61,.6)}
#hint{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:18px;color:var(--gold);font-weight:700;letter-spacing:.08em;text-shadow:0 2px 6px #000}
#draft{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 14px 12px;width:min(780px,96vw);pointer-events:auto}
#draft .hd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fd);font-size:20px;letter-spacing:.04em;margin-bottom:6px}
#draft .hd small{font-family:var(--fu);font-size:11px;color:var(--mute);letter-spacing:.14em;font-weight:600}
#draft .tb{height:5px;background:rgba(255,255,255,.12);margin-bottom:10px}
#draft .tb i{display:block;height:100%;background:var(--ember)}
.dc{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.it{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:8px 8px 9px;text-align:center;color:var(--fg);border-radius:3px;border-top:3px solid var(--c)}
.it:hover{background:rgba(255,255,255,.12)}
.it .k{position:absolute;left:6px;top:4px;font-size:11px;font-weight:700;color:var(--mute)}
.it .i{font-size:30px}.it .n{font-weight:700;font-size:13px;letter-spacing:.04em}.it .d{font-size:10.5px;color:var(--mute);line-height:1.25;margin-top:3px;min-height:26px}
.it.tk{opacity:.4;pointer-events:none;filter:grayscale(.8)}
.it .by{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.7);font-size:11px;font-weight:700;padding:3px;letter-spacing:.08em}
.it.me{opacity:1;filter:none;border-color:var(--good)}
#sec{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0;transition:opacity .3s}
#sec.on{opacity:1}
#sec .a{font-family:var(--fd);font-size:clamp(20px,3vw,34px);color:var(--gold);text-shadow:0 3px 0 #6a3a00,0 0 26px rgba(255,200,60,.6)}
#sec .b{font-family:var(--fd);font-size:clamp(34px,6vw,70px);color:#fff;margin:6px 0;text-shadow:0 5px 0 #3a1a8a,0 0 34px rgba(190,120,255,.7)}
#sec .c{font-size:20px;font-weight:700;color:var(--aether);letter-spacing:.06em}
#secbar{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);padding:6px 16px;font-weight:700;letter-spacing:.06em;color:var(--gold);border-color:var(--gold)}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 40%,rgba(255,60,30,.0) 100%);opacity:0}
/* ---------- overlays ---------- */
.ovl{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(5,9,24,.78);padding:16px;overflow:auto}
.box{background:linear-gradient(180deg,rgba(24,34,80,.96),rgba(10,16,40,.97));border:1px solid var(--line);border-top:5px solid var(--ember);border-radius:4px;padding:22px 26px;width:min(720px,100%);max-height:96vh;overflow:auto}
.box h1{font-family:var(--fd);font-weight:400;font-size:clamp(30px,5vw,54px);margin:0;letter-spacing:.03em}
.box h1.win{background:linear-gradient(180deg,#fff2b8,var(--gold) 50%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.box .rs{color:var(--mute);margin:4px 0 14px}
.stars{font-size:34px;letter-spacing:6px;color:var(--gold);margin:4px 0 8px}
.stars .o{color:#4a5580}
.res{display:grid;grid-template-columns:1fr auto;gap:5px 24px;font-size:15px;margin:10px 0}
.res span:nth-child(odd){color:var(--mute)}.res span:nth-child(even){font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.tbl th{font-size:11px;color:var(--mute);letter-spacing:.12em;text-align:left;padding:4px 6px;font-weight:600}
.tbl td{padding:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr.me td{color:var(--gold);font-weight:700}.tbl tr.w td:first-child::after{content:" 🏆"}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.aw div{background:rgba(255,255,255,.05);padding:8px 10px;border-radius:3px;font-size:12.5px;color:var(--mute)}
.aw b{display:block;color:var(--fg);font-size:14px;margin:2px 0}.aw em{color:var(--gold);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.nb{color:var(--good);font-weight:700;font-size:13px;margin:6px 0}
.chk{font-size:14px;margin:3px 0;color:var(--mute)}.chk.y{color:var(--good)}.chk::before{content:"○  "}.chk.y::before{content:"★  "}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
@media (max-width:640px){#race{width:176px}.slot{width:44px;height:44px}.slot .i{font-size:19px}.mis{grid-template-columns:1fr auto}.mis .ch{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#hud.ended #cross,#hud.ended #hotbar,#hud.ended #hint,#hud.ended #secbar,#hud.ended #race{display:none}
#draft.picked .it:not(.me){opacity:.35}
.btn[data-a="reset"]{border-left-color:var(--bad)}
#scr>:first-child{margin-top:auto}#scr>:last-child{margin-bottom:auto}
#scr{padding-bottom:6vh}
#hearts{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;gap:6px;font-size:28px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#hearts .on{color:#ff4d6d}
#hearts .off{color:rgba(255,255,255,.22)}
#hearts .pop{animation:hpop .5s}
@keyframes hpop{0%{transform:scale(1.8) rotate(-12deg);color:#fff}100%{transform:none}}
#hud.ended #hearts{display:none}
.rv{margin:8px 0 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rv img{width:min(240px,100%);aspect-ratio:1;border:3px solid var(--gold);border-radius:4px;transform:rotate(-2deg)}
.rv p{flex:1 1 220px;margin:0;font-size:15px;line-height:1.45;color:var(--mute)}
.rv b{color:var(--gold)}
/* ---------- touch / small screens ---------- */
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{touch-action:none}
#scr{touch-action:pan-y;-webkit-overflow-scrolling:touch}
#hotbar{pointer-events:auto}
.slot{touch-action:none}
.padf{outline:3px solid var(--gold)!important;outline-offset:2px;box-shadow:0 0 22px rgba(255,212,90,.5)}
#touch{position:absolute;inset:0;pointer-events:none;--sr:env(safe-area-inset-right,0px);--sl:env(safe-area-inset-left,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
#touch>*{touch-action:none}
#tz-move{position:absolute;left:0;top:24%;width:44%;bottom:0;pointer-events:auto}
#tz-look{position:absolute;right:0;top:10%;width:56%;bottom:0;pointer-events:auto}
#joy{position:absolute;left:calc(var(--sl) + 104px);top:calc(100% - var(--sb) - 112px);width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);pointer-events:none;opacity:.5}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7)}
.tbn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(14,22,56,.6);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;width:58px;height:58px;padding:0;backdrop-filter:blur(2px);-webkit-user-select:none}
.tbn.down{background:rgba(255,106,61,.8);border-color:#fff}
#tb-fire{width:88px;height:88px;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 26px);font-size:15px;border-color:var(--ember)}
#tb-jump{width:66px;height:66px;right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 22px)}
#tb-dash{right:calc(var(--sr) + 32px);bottom:calc(var(--sb) + 128px)}
#tb-hook{right:calc(var(--sr) + 112px);bottom:calc(var(--sb) + 104px)}
#tb-secret{width:66px;height:66px;right:calc(var(--sr) + 196px);bottom:calc(var(--sb) + 62px);color:var(--gold);border-color:var(--gold);animation:glow 1s infinite alternate}
#tb-climb{left:calc(var(--sl) + 24px);bottom:calc(var(--sb) + 196px)}
@keyframes glow{from{box-shadow:0 0 6px rgba(255,212,90,.4)}to{box-shadow:0 0 22px rgba(255,212,90,.9)}}
#tcorner{position:absolute;right:calc(var(--sr) + 10px);top:calc(var(--st) + 10px);display:flex;gap:8px;pointer-events:none}
#tcorner button{pointer-events:auto;width:42px;height:42px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(14,22,56,.6);color:#fff;font-weight:700;font-size:11px;padding:0}

<script src="lib/three.min.js"></script><script>
/* =====================================================================
   SKYBREAK — engine core
   ===================================================================== */
'use strict';
const T = THREE;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtP = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0'); };
const memStore = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('skybreak.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return k in memStore ? memStore[k] : d; } },
  set(k, v) { try { localStorage.setItem('skybreak.' + k, JSON.stringify(v)); } catch (e) { memStore[k] = v; } }
};

/* ---------- renderer / scene ---------- */
const canvas = $('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(72, 1, 0.25, 2500);
scene.add(camera);
scene.fog = new T.Fog(0xcfe9fa, 120, 620);
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const hemi = new T.HemisphereLight(0xcfe8ff, 0x7a8f5a, 0.85); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff0cf, 1.25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 260 });
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
const sunDir = new T.Vector3(0.5, 0.7, 0.35).normalize();
const flashLight = new T.PointLight(0xffaa55, 0, 70, 1.6); scene.add(flashLight);
let flashI = 0;

/* ---------- sky ---------- */
const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new T.Color() }, mid: { value: new T.Color() }, bot: { value: new T.Color() },
    sunDir: { value: sunDir }, sunCol: { value: new T.Color(1, .9, .7) }, stars: { value: 0 }
  },
  vertexShader: 'varying vec3 vd; void main(){ vd=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} ',
  fragmentShader: `varying vec3 vd; uniform vec3 top,mid,bot,sunDir,sunCol; uniform float stars;
  float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  void main(){ vec3 d=normalize(vd); float h=d.y;
    vec3 c=mix(bot,mid,smoothstep(-0.30,0.10,h)); c=mix(c,top,smoothstep(0.08,0.85,h));
    float s=max(dot(d,sunDir),0.0); c+=sunCol*(pow(s,700.0)*2.4+pow(s,14.0)*0.28);
    if(stars>0.0){ vec2 g=floor(vec2(atan(d.x,d.z)*90.0,d.y*180.0)); float r=h21(g); c+=vec3(step(0.9972,r))*stars*smoothstep(0.02,0.3,h)*(0.4+0.6*h21(g+3.0)); }
    gl_FragColor=vec4(c,1.0);} `
});
const sky = new T.Mesh(new T.SphereGeometry(1, 32, 18), skyMat);
sky.scale.setScalar(1500); sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

const THEMES = {
  verdantia: { top: 0x2f7de0, mid: 0x7ec8f5, bot: 0xeaf6ff, fog: 0xcfe9fa, sun: 0xfff0cf, sunI: 1.25, hs: 0xcfe8ff, hg: 0x7a8f5a, hi: 0.85, cloud: 0xffffff, stars: 0, dir: [.5, .7, .35] },
  ignis: { top: 0x1c0a18, mid: 0x7a2630, bot: 0xff9a55, fog: 0x8a3a28, sun: 0xffa868, sunI: 1.1, hs: 0xff9a70, hg: 0x4a1f1a, hi: 0.8, cloud: 0xc77a6e, stars: 0, dir: [-.6, .32, .5] },
  nivara: { top: 0x4a8bd6, mid: 0xa8d6f6, bot: 0xf4fbff, fog: 0xdcf0ff, sun: 0xf6fbff, sunI: 1.25, hs: 0xd8eeff, hg: 0x90a8c0, hi: 0.95, cloud: 0xf4fbff, stars: 0, dir: [.4, .55, -.5] },
  aridia: { top: 0x3b9be0, mid: 0xf1d598, bot: 0xffe7b4, fog: 0xf5dcaa, sun: 0xfff2c8, sunI: 1.45, hs: 0xffe8c0, hg: 0xc79a5a, hi: 0.85, cloud: 0xfff1d8, stars: 0, dir: [.3, .85, .2] },
  aquaris: { top: 0x0f7fd8, mid: 0x58d3e8, bot: 0xd9fbff, fog: 0xbdeff7, sun: 0xffffff, sunI: 1.25, hs: 0xcff7ff, hg: 0x3aa0a0, hi: 0.9, cloud: 0xffffff, stars: 0, dir: [-.4, .75, .4] },
  noctyra: { top: 0x04020e, mid: 0x28144c, bot: 0x7a3fb0, fog: 0x2b1b4c, sun: 0xb99cff, sunI: 0.85, hs: 0x8a7aff, hg: 0x1f1538, hi: 0.95, cloud: 0x6a4aa8, stars: 1, dir: [.3, .5, -.6] },
  menu: { top: 0x1a3f9c, mid: 0xf08a6e, bot: 0xffd9a0, fog: 0xf3b890, sun: 0xffe0b0, sunI: 1.2, hs: 0xffd9c0, hg: 0x7a6a8a, hi: 0.85, cloud: 0xfff0e8, stars: 0, dir: [-.7, .22, .6] }
};
let curTheme = 'verdantia';
function applyTheme(name) {
  const t = THEMES[name] || THEMES.verdantia; curTheme = name;
  const u = skyMat.uniforms;
  u.top.value.setHex(t.top); u.mid.value.setHex(t.mid); u.bot.value.setHex(t.bot); u.sunCol.value.setHex(t.sun); u.stars.value = t.stars;
  sunDir.set(t.dir[0], t.dir[1], t.dir[2]).normalize();
  scene.fog.color.setHex(t.fog); sun.color.setHex(t.sun); sun.intensity = t.sunI;
  hemi.color.setHex(t.hs); hemi.groundColor.setHex(t.hg); hemi.intensity = t.hi;
  cloudMat.color.setHex(t.cloud);
}

/* ---------- cloud sea ---------- */
const cloudMat = new T.MeshLambertMaterial({ color: 0xffffff });
const CLOUDN = 170;
const cloudMesh = new T.InstancedMesh(new T.IcosahedronGeometry(1, 1), cloudMat, CLOUDN);
cloudMesh.frustumCulled = false; scene.add(cloudMesh);
const clouds = [];
for (let i = 0; i < CLOUDN; i++) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 520;
  const hi = i > CLOUDN * 0.82;
  clouds.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: hi ? rnd(-30, 30) : rnd(-110, -75), s: hi ? rnd(10, 22) : rnd(30, 62), sp: rnd(0.4, 1.4) });
  if (hi && r < 150) { clouds[i].x += Math.sign(clouds[i].x || 1) * 150; }
}
const _cd = new T.Object3D();
function updateClouds(t) {
  for (let i = 0; i < CLOUDN; i++) {
    const c = clouds[i];
    _cd.position.set(c.x + Math.sin(t * 0.03 * c.sp + i) * 14, c.y, c.z + Math.cos(t * 0.025 * c.sp + i * 2) * 10);
    _cd.scale.set(c.s, c.s * 0.34, c.s * 0.82); _cd.updateMatrix(); cloudMesh.setMatrixAt(i, _cd.matrix);
  }
  cloudMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- input ---------- */
const Input = {
  keys: {}, pressed: {}, mouse: { l: false, r: false }, mpress: { l: false, r: false }, dx: 0, dy: 0, wheel: 0, locked: false, nx: 0, ny: 0, captureWanted: false, ax: 0, ay: 0, px: 0, py: 0, touch: false, pad: false,
  endFrame() { this.pressed = {}; this.mpress.l = this.mpress.r = false; this.dx = 0; this.dy = 0; this.wheel = 0; }
};
window.addEventListener('keydown', e => {
  Input.pad = false;
  if (e.repeat) { if (Input.captureWanted) e.preventDefault(); return; }
  Input.keys[e.code] = true; Input.pressed[e.code] = true;
  if (Input.captureWanted && ['Space', 'Tab', 'F5', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
window.addEventListener('blur', () => { Input.keys = {}; Input.mouse.l = Input.mouse.r = false; });
canvas.addEventListener('mousedown', e => {
  if (!Input.captureWanted) return;
  if (!Input.locked) lockPointer();
  if (e.button === 0) { Input.mouse.l = true; Input.mpress.l = true; }
  if (e.button === 2) { Input.mouse.r = true; Input.mpress.r = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', e => { if (e.button === 0) Input.mouse.l = false; if (e.button === 2) Input.mouse.r = false; });
window.addEventListener('contextmenu', e => { if (Input.captureWanted) e.preventDefault(); });
window.addEventListener('mousemove', e => {
  Input.nx = e.clientX / window.innerWidth * 2 - 1; Input.ny = e.clientY / window.innerHeight * 2 - 1;
  if (Input.locked) { Input.dx += e.movementX || 0; Input.dy += e.movementY || 0; }
  if (e.movementX || e.movementY) Input.pad = false;
});
window.addEventListener('wheel', e => { if (Input.captureWanted) Input.wheel += Math.sign(e.deltaY); }, { passive: true });
/* Pointer lock freezes clientX/clientY at 0 for every pointer (touch included), which broke the on-screen joystick —
   so it is never taken while touch controls are active. */
function lockPointer() { if (Input.touch || !canvas.requestPointerLock) return; try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (err) { } }
function unlockPointer() { if (document.pointerLockElement && document.exitPointerLock) try { document.exitPointerLock(); } catch (e) { } }
document.addEventListener('pointerlockchange', () => {
  Input.locked = document.pointerLockElement === canvas;
  if (Input.locked && Input.touch) { unlockPointer(); return; }
  if (!Input.locked && !Input.touch && Input.captureWanted && window.Game && Game.state === 'play') Game.pause(true);
});

/* ---------- audio (synth) ---------- */
const Snd = {
  ctx: null, master: null, vol: 0.6, muted: false, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 1.5, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; this.noiseBuf = b;
    } catch (e) { this.ctx = null; }
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = this.muted ? 0 : v; },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : this.vol; },
  noise(dur, f0, f1, vol, type = 'lowpass') {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.playbackRate.value = rnd(0.8, 1.2);
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, rnd(0, 0.5), dur + 0.05);
  },
  tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  play(name, v = 1) {
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'boom': this.noise(0.9, 900, 60, 0.9 * v); this.tone(90, 30, 0.6, 0.7 * v, 'sine'); break;
      case 'bigboom': this.noise(1.4, 1400, 40, 1.0 * v); this.tone(70, 22, 1.1, 0.9 * v, 'sine'); break;
      case 'pop': this.noise(0.25, 1800, 200, 0.5 * v); this.tone(160, 60, 0.15, 0.4 * v, 'triangle'); break;
      case 'hit': this.noise(0.12, 2600, 400, 0.45 * v, 'bandpass'); this.tone(220, 110, 0.08, 0.25 * v, 'square'); break;
      case 'swing': this.noise(0.18, 600, 1800, 0.18 * v, 'bandpass'); break;
      case 'crumble': this.noise(0.7, 700, 90, 0.5 * v); break;
      case 'zap': this.noise(0.35, 5000, 400, 0.7 * v, 'highpass'); this.tone(900, 80, 0.3, 0.3 * v, 'sawtooth'); break;
      case 'whoosh': this.noise(0.5, 300, 1500, 0.25 * v, 'bandpass'); break;
      case 'grapple': this.tone(300, 900, 0.12, 0.25 * v, 'square'); break;
      case 'dash': this.noise(0.25, 2400, 300, 0.3 * v, 'bandpass'); break;
      case 'ui': this.tone(660, 880, 0.08, 0.25 * v, 'triangle'); break;
      case 'pick': this.tone(520, 1040, 0.12, 0.3 * v, 'triangle'); this.tone(780, 1560, 0.14, 0.25 * v, 'triangle', 0.08); break;
      case 'drop': this.tone(440, 440, 0.12, 0.3 * v, 'square'); this.tone(660, 660, 0.12, 0.3 * v, 'square', 0.14); this.tone(880, 880, 0.25, 0.3 * v, 'square', 0.28); break;
      case 'secret': for (let i = 0; i < 6; i++) this.tone(400 * Math.pow(1.26, i), 400 * Math.pow(1.26, i) * 1.01, 0.3, 0.22 * v, 'triangle', i * 0.08); break;
      case 'fire': this.noise(0.4, 1200, 300, 0.25 * v); break;
      case 'ice': this.tone(1800, 2600, 0.15, 0.2 * v, 'sine'); this.noise(0.2, 6000, 2000, 0.2 * v, 'highpass'); break;
      case 'win': for (let i = 0; i < 5; i++) this.tone(330 * Math.pow(1.335, i * 0.8), 330 * Math.pow(1.335, i * 0.8), 0.4, 0.28 * v, 'triangle', i * 0.12); break;
      case 'lose': this.tone(300, 80, 0.8, 0.35 * v, 'sawtooth'); break;
      case 'tick': this.tone(1000, 1000, 0.05, 0.2 * v, 'square'); break;
      case 'chain': this.tone(500, 1000, 0.18, 0.28 * v, 'square'); break;
    }
  }
};

/* ---------- instanced particles ---------- */
class Particles {
  constructor(max, additive, opacity = 1) {
    this.max = max; this.next = 0;
    this.pos = new Float32Array(max * 3); this.vel = new Float32Array(max * 3);
    this.life = new Float32Array(max); this.ml = new Float32Array(max); this.size = new Float32Array(max);
    this.grav = new Float32Array(max); this.drag = new Float32Array(max);
    const mat = new T.MeshBasicMaterial({ transparent: true, opacity, depthWrite: false, blending: additive ? T.AdditiveBlending : T.NormalBlending });
    this.mesh = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), mat, max);
    this.mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
    this.mesh.instanceColor = new T.InstancedBufferAttribute(new Float32Array(max * 3).fill(1), 3);
    this.mesh.frustumCulled = false; this.mesh.renderOrder = additive ? 5 : 4;
    const a = this.mesh.instanceMatrix.array; for (let i = 0; i < max; i++) { a[i * 16] = a[i * 16 + 5] = a[i * 16 + 10] = 0; a[i * 16 + 15] = 1; }
    scene.add(this.mesh);
  }
  emit(x, y, z, vx, vy, vz, col, size, life, grav = 0, drag = 0) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
    this.life[i] = this.ml[i] = life; this.size[i] = size; this.grav[i] = grav; this.drag[i] = drag;
    const c = this.mesh.instanceColor.array; c[i * 3] = ((col >> 16) & 255) / 255; c[i * 3 + 1] = ((col >> 8) & 255) / 255; c[i * 3 + 2] = (col & 255) / 255;
  }
  update(dt) {
    const a = this.mesh.instanceMatrix.array, p = this.pos, v = this.vel;
    for (let i = 0; i < this.max; i++) {
      const o = i * 16;
      if (this.life[i] <= 0) { if (a[o] !== 0) { a[o] = a[o + 5] = a[o + 10] = 0; } continue; }
      this.life[i] -= dt;
      if (this.life[i] <= 0) { a[o] = a[o + 5] = a[o + 10] = 0; continue; }
      const d = 1 - this.drag[i] * dt; v[i * 3] *= d; v[i * 3 + 1] = v[i * 3 + 1] * d - this.grav[i] * dt; v[i * 3 + 2] *= d;
      p[i * 3] += v[i * 3] * dt; p[i * 3 + 1] += v[i * 3 + 1] * dt; p[i * 3 + 2] += v[i * 3 + 2] * dt;
      const s = this.size[i] * Math.min(1, this.life[i] / this.ml[i] * 2.2);
      a[o] = s; a[o + 5] = s; a[o + 10] = s; a[o + 12] = p[i * 3]; a[o + 13] = p[i * 3 + 1]; a[o + 14] = p[i * 3 + 2];
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}
const glowP = new Particles(3500, true, 0.95);
const dustP = new Particles(2200, false, 0.55);

/* ---------- debris physics (instanced, lit) ---------- */
const GRAV = { scale: 1 };
class Debris {
  constructor(max) {
